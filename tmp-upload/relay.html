<!doctype html><meta charset="utf-8"><script>
(async () => {
  const names = ['iap-review.png'];
  for (let i = 1; i <= 6; i++) names.push(`iphone-ja-${String(i).padStart(2, '0')}.png`);
  const out = {};
  for (const n of names) out[n] = await (await fetch(n)).blob();
  parent.postMessage(out, 'https://appstoreconnect.apple.com');
})();
</script>
